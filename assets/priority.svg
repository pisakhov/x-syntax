<svg xmlns="http://www.w3.org/2000/svg" width="960" height="250" viewBox="0 0 960 250" role="img" aria-labelledby="title desc">
<title id="title">Preservation takes priority over the goal</title>
<desc id="desc">If verbatim code alone is 800 characters and the goal is 600, keep the code unchanged and report that the result exceeds the goal.</desc>
<rect width="960" height="250" rx="20" fill="#f4f7f8"/>
<text x="32" y="42" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#0b2238">PRESERVATION &gt; GOAL</text>
<rect x="32" y="70" width="250" height="100" rx="12" fill="#e0f6f2" stroke="#168d84" stroke-width="2"/>
<text x="157" y="108" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#0b2238">CODE = 800 CHARACTERS</text>
<text x="157" y="141" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#37566d">PRESERVE VERBATIM</text>
<path d="M290 120h37m-9-8 9 8-9 8" fill="none" stroke="#168d84" stroke-width="3"/>
<rect x="337" y="70" width="250" height="100" rx="12" fill="#fff2d9" stroke="#c49335" stroke-width="2"/>
<text x="462" y="108" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#0b2238">GOAL = 600 CHARACTERS</text>
<text x="462" y="141" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#37566d">CONFLICT</text>
<path d="M596 120h37m-9-8 9 8-9 8" fill="none" stroke="#168d84" stroke-width="3"/>
<rect x="643" y="70" width="285" height="100" rx="12" fill="#0b2238"/>
<text x="785" y="108" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#ffffff">KEEP CODE UNCHANGED</text>
<text x="785" y="141" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#b9ddd9">REPORT OVER-LIMIT RESULT</text>
<text x="32" y="217" font-family="Arial,sans-serif" font-size="16" fill="#486478">A declared priority, not an automatic guarantee. Check the result.</text>
</svg>
